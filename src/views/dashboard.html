<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 2.0 — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .status-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .status-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .status-badge.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-badge.qr .dot { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
  .status-badge.reconnecting .dot { background: var(--orange); }
  .status-badge.logged_out .dot,
  .status-badge.disconnected .dot { background: var(--red); }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .card .card-label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary); margin-bottom: 8px; }
  .card .card-value { font-size: 28px; font-weight: 700; }
  .card .card-icon { font-size: 18px; margin-bottom: 4px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  .panel-header h2 { font-size: 15px; font-weight: 600; }
  .panel-body { padding: 20px; }
  .filters { display: flex; gap: 8px; }
  .filters button {
    padding: 4px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  .filters button:hover { border-color: var(--accent); color: var(--text); }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--surface-2); }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
  }
  .badge.active { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.inactive { background: rgba(139,148,158,.15); color: var(--text-secondary); }
  .badge.interval { background: rgba(88,166,255,.15); color: var(--accent); }
  .actions { display: flex; gap: 6px; }
  .actions button {
    padding: 4px 8px; border-radius: 4px; border: none;
    font-size: 12px; cursor: pointer; transition: all .15s;
    background: var(--surface-2); color: var(--text-secondary);
  }
  .actions button:hover { background: var(--border); color: var(--text); }
  .actions button.danger:hover { background: rgba(248,81,73,.2); color: var(--red); }
  .btn-primary {
    padding: 8px 20px; border-radius: var(--radius); border: none;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-secondary {
    padding: 8px 20px; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 13px;
    cursor: pointer; transition: all .15s;
  }
  .btn-secondary:hover { background: var(--surface-2); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  .empty p { font-size: 14px; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.5);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { font-size: 16px; }
  .modal-close {
    background: none; border: none; color: var(--text-secondary);
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px; }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 16px 20px; border-top: 1px solid var(--border);
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 14px; transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--accent);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 24px; border-radius: var(--radius);
    font-size: 13px; z-index: 2000; opacity: 0;
    transform: translateY(10px); transition: all .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: rgba(63,185,80,.9); color: #fff; }
  .toast.error { background: rgba(248,81,73,.9); color: #fff; }

  .qr-section {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; gap: 12px;
  }
  .qr-section img { width: 180px; height: 180px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
  .qr-section p { color: var(--text-secondary); font-size: 13px; text-align: center; }
  .no-mobile-warning {
    background: rgba(210,153,34,.1); border: 1px solid var(--orange);
    border-radius: var(--radius); padding: 16px; margin-bottom: 24px;
    font-size: 13px; color: var(--orange); display: none;
  }

  .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
  .loading::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🤖 JARVIS <span>2.0</span></h1>
  </div>
  <div class="header-right">
    <div id="statusBadge" class="status-badge disconnected">
      <span class="dot"></span>
      <span id="statusText">Desconectado</span>
    </div>
    <a href="/" style="color:var(--text-secondary);text-decoration:none;font-size:13px;">Início</a>
  </div>
</div>

<div class="container">
  <div id="noMobileWarning" class="no-mobile-warning">
    ⚠️ O QR Code é para conexão via WhatsApp Web. Use o celular para escanear.
  </div>

  <div class="two-col">
    <div>
      <div class="panel" id="qrPanel">
        <div class="panel-header">
          <h2>📱 WhatsApp</h2>
        </div>
        <div class="panel-body" id="qrPanelBody">
          <div class="loading">Carregando</div>
        </div>
      </div>
    </div>

    <div>
      <div class="cards" id="statsCards"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>📋 Lembretes</h2>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div class="filters" id="filterButtons">
          <button data-status="all" class="active">Todos</button>
          <button data-status="active">Ativos</button>
          <button data-status="inactive">Inativos</button>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">+ Novo</button>
      </div>
    </div>
    <div class="panel-body" style="padding:0;overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Label</th>
            <th>Telefone</th>
            <th>Próximo disparo</th>
            <th>Intervalo</th>
            <th>Término</th>
            <th>Status</th>
            <th style="width:80px;"></th>
          </tr>
        </thead>
        <tbody id="remindersBody">
          <tr><td colspan="7"><div class="loading">Carregando</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Novo Lembrete</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Descrição</label>
        <input id="formLabel" placeholder="Ex: Tomar DIPIRONA 💊" />
      </div>
      <div class="form-group">
        <label>Telefone (opcional, formato 5567999999999)</label>
        <input id="formPhone" placeholder="5567996543700" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Primeiro disparo</label>
          <input id="formFirstFire" type="datetime-local" />
        </div>
        <div class="form-group">
          <label>Antecedência (min)</label>
          <input id="formAdvance" type="number" value="0" min="0" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Repetir a cada (min) — vazio = único</label>
          <input id="formInterval" type="number" min="0" placeholder="Ex: 360" />
        </div>
        <div class="form-group">
          <label>Término da repetição</label>
          <input id="formEndAt" type="datetime-local" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="modalSaveBtn" onclick="saveReminder()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/dashboard';

let currentFilter = 'all';
let editingId = null;

async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Erro na requisição');
  }
  return res.json();
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.classList.remove('show'); }, 3500);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatInterval(min) {
  if (!min) return '—';
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `${h}h${m}m` : `${h}h`;
}

async function loadStats() {
  try {
    const stats = await fetchJSON(`${API}/api/stats`);
    document.getElementById('statsCards').innerHTML = `
      <div class="card">
        <div class="card-icon">📝</div>
        <div class="card-label">Total</div>
        <div class="card-value">${stats.total}</div>
      </div>
      <div class="card">
        <div class="card-icon">✅</div>
        <div class="card-label">Ativos</div>
        <div class="card-value" style="color:var(--green)">${stats.active}</div>
      </div>
      <div class="card">
        <div class="card-icon">🔥</div>
        <div class="card-label">Disparos hoje</div>
        <div class="card-value" style="color:var(--orange)">${stats.today_count}</div>
      </div>
      <div class="card">
        <div class="card-icon">⏳</div>
        <div class="card-label">Pendentes</div>
        <div class="card-value" style="color:${stats.pending > 0 ? 'var(--red)' : 'var(--text)'}">${stats.pending}</div>
      </div>
    `;
  } catch (e) {
    document.getElementById('statsCards').innerHTML = `<div class="card"><div class="card-label">Erro ao carregar estatísticas</div></div>`;
  }
}

async function loadStatus() {
  try {
    const s = await fetchJSON(`${API}/api/status`);
    const badge = document.getElementById('statusBadge');
    const text = document.getElementById('statusText');
    badge.className = `status-badge ${s.status}`;

    const qrBody = document.getElementById('qrPanelBody');

    switch (s.status) {
      case 'connected':
        text.textContent = 'Conectado ✓';
        qrBody.innerHTML = `<div style="text-align:center;padding:20px;"><span style="font-size:48px;">✅</span><p style="margin-top:12px;color:var(--green);font-weight:500;">WhatsApp conectado com sucesso!</p><p style="color:var(--text-secondary);font-size:12px;margin-top:4px;">O JARVIS está pronto para receber mensagens.</p></div>`;
        document.getElementById('noMobileWarning').style.display = 'none';
        break;
      case 'qr':
        text.textContent = 'QR Code disponível';
        qrBody.innerHTML = s.qr
          ? `<div class="qr-section"><img src="${s.qr}" alt="QR Code" /><p>Escaneie com o WhatsApp no celular<br/><span style="font-size:12px;">Menu > Dispositivos conectados > Conectar</span></p></div>`
          : `<div class="loading">Aguardando QR</div>`;
        document.getElementById('noMobileWarning').style.display = 'block';
        break;
      case 'reconnecting':
        text.textContent = 'Reconectando...';
        qrBody.innerHTML = `<div style="text-align:center;padding:20px;color:var(--orange);"><span style="font-size:32px;">🔄</span><p style="margin-top:8px;">Reconectando ao WhatsApp...</p></div>`;
        document.getElementById('noMobileWarning').style.display = 'none';
        break;
      default:
        text.textContent = 'Desconectado';
        qrBody.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-secondary);"><span style="font-size:32px;">📵</span><p style="margin-top:8px;">WhatsApp desconectado. O JARVIS tentará reconectar automaticamente.</p></div>`;
        document.getElementById('noMobileWarning').style.display = 'none';
    }
  } catch (e) {
    console.error('Status error:', e);
  }
}

async function loadReminders() {
  try {
    const reminders = await fetchJSON(`${API}/api/reminders?status=${currentFilter}`);
    const tbody = document.getElementById('remindersBody');

    if (!reminders.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><p>Nenhum lembrete encontrado</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = reminders.map(r => `
      <tr>
        <td style="font-weight:500;">${escapeHtml(r.label)}</td>
        <td style="color:var(--text-secondary);font-size:12px;">${r.phone || '—'}</td>
        <td>${formatDate(r.next_fire_at)}</td>
        <td>${r.interval_minutes ? `<span class="badge interval">${formatInterval(r.interval_minutes)}</span>` : '<span style="color:var(--text-secondary);font-size:12px;">Único</span>'}</td>
        <td style="color:var(--text-secondary);font-size:12px;">${formatDate(r.end_at)}</td>
        <td><span class="badge ${r.active ? 'active' : 'inactive'}">${r.active ? 'Ativo' : 'Inativo'}</span></td>
        <td>
          <div class="actions">
            ${r.active ? `<button onclick="toggleReminder('${r.id}', false)" title="Desativar">⏸️</button>` : `<button onclick="toggleReminder('${r.id}', true)" title="Ativar">▶️</button>`}
            <button class="danger" onclick="deleteReminder('${r.id}')" title="Excluir">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('remindersBody').innerHTML = `<tr><td colspan="7"><div class="empty"><p>Erro ao carregar lembretes</p></div></td></tr>`;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function toggleReminder(id, active) {
  try {
    await fetchJSON(`${API}/api/reminders/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ active }),
    });
    showToast(active ? 'Lembrete ativado' : 'Lembrete desativado');
    loadReminders();
    loadStats();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function deleteReminder(id) {
  if (!confirm('Tem certeza que deseja excluir este lembrete?')) return;
  try {
    await fetchJSON(`${API}/api/reminders/${id}`, { method: 'DELETE' });
    showToast('Lembrete excluído');
    loadReminders();
    loadStats();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function openCreateModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Novo Lembrete';
  document.getElementById('formLabel').value = '';
  document.getElementById('formPhone').value = '';
  document.getElementById('formFirstFire').value = '';
  document.getElementById('formAdvance').value = '0';
  document.getElementById('formInterval').value = '';
  document.getElementById('formEndAt').value = '';
  document.getElementById('modalSaveBtn').textContent = 'Salvar';
  document.getElementById('modal').classList.add('open');
}

async function saveReminder() {
  const label = document.getElementById('formLabel').value.trim();
  const phone = document.getElementById('formPhone').value.trim() || 'dashboard';
  const first_fire_at = document.getElementById('formFirstFire').value;
  const advance_minutes = parseInt(document.getElementById('formAdvance').value) || 0;
  const intervalInput = document.getElementById('formInterval').value;
  const interval_minutes = intervalInput ? parseInt(intervalInput) : null;
  const endAtValue = document.getElementById('formEndAt').value;
  const end_at = endAtValue ? new Date(endAtValue).toISOString() : null;

  if (!label) return showToast('Descrição é obrigatória', 'error');
  if (!first_fire_at) return showToast('Data do primeiro disparo é obrigatória', 'error');

  const firstFireISO = new Date(first_fire_at).toISOString();

  try {
    if (editingId) {
      await fetchJSON(`${API}/api/reminders/${editingId}`, {
        method: 'PATCH',
        body: JSON.stringify({ label, phone, next_fire_at: firstFireISO, interval_minutes, end_at, advance_minutes }),
      });
      showToast('Lembrete atualizado');
    } else {
      await fetchJSON(`${API}/api/reminders`, {
        method: 'POST',
        body: JSON.stringify({ label, phone, first_fire_at: firstFireISO, interval_minutes, end_at, advance_minutes }),
      });
      showToast('Lembrete criado');
    }
    closeModal();
    loadReminders();
    loadStats();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

document.querySelectorAll('#filterButtons button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterButtons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    loadReminders();
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

async function loadAll() {
  await Promise.all([loadStats(), loadStatus(), loadReminders()]);
}

loadAll();
setInterval(loadStatus, 10000);
setInterval(loadStats, 30000);
</script>
</body>
</html>
